name: Demo CI

on:
  pull_request:
    paths:
      - 'demo/**'
      - '.github/workflows/demo-ci.yml'

  push:
    branches:
      - main
    paths:
      - 'demo/**'
      - '.github/workflows/demo-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-bootstrap:
    name: Rocky 10 host bootstrap
    runs-on: chickadee-small-rocky-102
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify runner
        shell: bash
        run: |
          set -euo pipefail

          source /etc/os-release

          test "$ID" = "rocky"
          test "${VERSION_ID%%.*}" = "10"
          test "$(uname -m)" = "x86_64"

          sudo -n true

          echo "Runner: $PRETTY_NAME"
          uname -r

      - name: Install Docker
        shell: bash
        run: |
          set -euo pipefail

          RUNNING_KERNEL="$(uname -r)"

          echo "Running kernel: ${RUNNING_KERNEL}"

          sudo dnf install -y \
            dnf-plugins-core \
            kmod \
            "kernel-modules-core-${RUNNING_KERNEL}" \
            "kernel-modules-${RUNNING_KERNEL}"

          sudo modprobe overlay
          sudo modprobe br_netfilter
          sudo modprobe nf_nat
          sudo modprobe xt_addrtype

          echo "Loaded Docker networking modules:"
          lsmod | grep -E 'overlay|br_netfilter|nf_nat|xt_addrtype'

          sudo dnf config-manager --add-repo \
            https://download.docker.com/linux/rhel/docker-ce.repo

          sudo dnf install -y \
            --setopt=install_weak_deps=False \
            docker-ce \
            docker-ce-cli \
            containerd.io \
            docker-buildx-plugin \
            docker-compose-plugin

          sudo systemctl start docker

      - name: Verify Docker
        shell: bash
        run: |
          set -euo pipefail

          sudo docker version
          sudo docker compose version
          sudo docker info

      - name: Validate bootstrap files
        shell: bash
        run: |
          set -euo pipefail

          test -x demo/scripts/bootstrap-host.sh

          bash -n demo/versions.env
          bash -n demo/scripts/bootstrap-host.sh

          source demo/versions.env

          test "$ROCKY_MAJOR" = "10"
          test "$OPENHPC_MAJOR" = "4"
          test -n "$SLURM_SERIES"

      - name: Run host bootstrap
        shell: bash
        run: |
          set -euo pipefail

          sudo ./demo/scripts/bootstrap-host.sh

      - name: Verify host bootstrap
        shell: bash
        run: |
          set -euo pipefail

          source demo/versions.env

          ACTUAL_VERSION="$(squeue --version | awk '{print $2}')"

          case "$ACTUAL_VERSION" in
            "${SLURM_SERIES}".*)
              ;;
            *)
              echo "Expected Slurm ${SLURM_SERIES}.x, got ${ACTUAL_VERSION}"
              exit 1
              ;;
          esac

          test "$(command -v squeue)" = "/usr/bin/squeue"
          test "$(command -v sacct)" = "/usr/bin/sacct"
          test "$(command -v scontrol)" = "/usr/bin/scontrol"
          test "$(command -v sinfo)" = "/usr/bin/sinfo"
          test "$(command -v sprio)" = "/usr/bin/sprio"
          test "$(command -v sbatch)" = "/usr/bin/sbatch"
          test "$(command -v srun)" = "/usr/bin/srun"
          test "$(command -v seff)" = "/usr/bin/seff"

          rpm -q slurm-ohpc
          rpm -q slurm-contribs-ohpc
          rpm -q munge

          systemctl is-active --quiet munge

          munge -n | unmunge >/dev/null

          sudo test -s /srv/slurm-view-demo/secrets/munge.key
          sudo test -s /srv/slurm-view-demo/state/versions.env

          sudo cmp \
            /srv/slurm-view-demo/secrets/munge.key \
            /etc/munge/munge.key

          sudo cat /srv/slurm-view-demo/state/versions.env

      - name: Record bootstrap state
        shell: bash
        run: |
          set -euo pipefail

          MUNGE_HASH="$(
            sudo sha256sum /srv/slurm-view-demo/secrets/munge.key \
              | awk '{print $1}'
          )"

          VERSION_STATE_HASH="$(
            sudo sha256sum /srv/slurm-view-demo/state/versions.env \
              | awk '{print $1}'
          )"

          echo "MUNGE_HASH=$MUNGE_HASH" >> "$GITHUB_ENV"
          echo "VERSION_STATE_HASH=$VERSION_STATE_HASH" >> "$GITHUB_ENV"

      - name: Run host bootstrap again
        shell: bash
        run: |
          set -euo pipefail

          sudo ./demo/scripts/bootstrap-host.sh

      - name: Verify repeat bootstrap
        shell: bash
        run: |
          set -euo pipefail

          source demo/versions.env

          ACTUAL_VERSION="$(squeue --version | awk '{print $2}')"

          case "$ACTUAL_VERSION" in
            "${SLURM_SERIES}".*)
              ;;
            *)
              echo "Expected Slurm ${SLURM_SERIES}.x, got ${ACTUAL_VERSION}"
              exit 1
              ;;
          esac

          systemctl is-active --quiet munge
          munge -n | unmunge >/dev/null

          CURRENT_MUNGE_HASH="$(
            sudo sha256sum /srv/slurm-view-demo/secrets/munge.key \
              | awk '{print $1}'
          )"

          CURRENT_VERSION_STATE_HASH="$(
            sudo sha256sum /srv/slurm-view-demo/state/versions.env \
              | awk '{print $1}'
          )"

          test "$CURRENT_MUNGE_HASH" = "$MUNGE_HASH"
          test "$CURRENT_VERSION_STATE_HASH" = "$VERSION_STATE_HASH"

          sudo cmp \
            /srv/slurm-view-demo/secrets/munge.key \
            /etc/munge/munge.key
